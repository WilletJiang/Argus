name: C harness
on: [push, pull_request]
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAH_SANITIZE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - run: ./scripts/check-standalone.sh
